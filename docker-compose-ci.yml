version: "3"
services:
  o_apis_db:
    container_name: o_apis_db
    image: mysql:8.0
    volumes:
      - ./docker/db/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_DATABASE=homestead
      - MYSQL_USER=homestead
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=secret
      - TZ=Asia/Tokyo
      - DB_PORT=3306
    ports:
      - "3306:3306"
    networks:
      - o_apis_nw

  o_apis_srv:
    container_name: o_apis_srv
    image: node:latest
    working_dir: /app
    ports:
      - 3000:3000
      - 6006:6006
    tty: true
    volumes:
      - ./service:/app
    networks:
      - o_apis_nw

networks:
  o_apis_nw:
    driver: bridge    

