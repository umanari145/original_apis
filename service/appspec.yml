version: 0.0
os: linux
files:
  - source: /
    destination: /opt/bitnami/app
    overwrite: true

permissions:
  - object: /opt/bitnami/app
    owner: bitnami
    group: bitnami

hooks:
  AfterInstall:
    - location: ./install.sh
      timeout: 60
      runas: bitnami
  ApplicationStart:
    - location: ./appstart.sh
      timeout: 60
      runas: bitnami