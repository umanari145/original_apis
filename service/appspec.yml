version: 0.0
os: linux
files:
  - source: /
    destination: /opt/bitnami/app

permissions:
  - object: /opt/bitnami/app
    owner: bitnami
    group: bitnami

hooks:
  BeforeInstall:
    - location: ./before_install.sh
      timeout: 60
      runas: bitnami      
  AfterInstall:
    - location: ./install.sh
      timeout: 60
      runas: bitnami
